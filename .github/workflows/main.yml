name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: APK (${{ matrix.label }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - label: 64-bit
            abi: arm64-v8a
            python: '3.13'
            qjs: qjs-linux-aarch64
            qjs_sha256: 3372133484edf50a69f3c67903af41206d22a061e930e3cfb63269272ef56d2e
            ffmpeg_sha256: 1b8d5c371ea79e6e7a1930b31f2ad6a2731e48d75ceddc9c36dffda6e0092401
            ffprobe_sha256: a4d4a6d1562aa87934e99ee1a43f8090ec1040659cedb667d6edf3aa08408c5e
            ffmpeg_libs_sha256: 4664a895283f9f31786be39b0c484c1f96631f02c7c7f9c70a4a4a2da324a092
            python_libs_sha256: 7edecb6c9bd3a94456168d44911d8aea9f917bedef90c320a29500d92ac3eb62
          - label: 32-bit
            abi: armeabi-v7a
            python: '3.11'
            qjs: qjs-linux-armv7
            qjs_sha256: dbda6e499471c675bd991dbc477f14d6134c182409d15047e9b63e3df7bc3e64
            ffmpeg_sha256: 3d6207c6dd682b080d8784b627a7b2aeb034dba854dc24685517747eddc2e231
            ffprobe_sha256: dcf506cb00e210753afd67c0a9129328f84bdd2fe74b3afc18d986f67da9036f
            ffmpeg_libs_sha256: 5b4a436358e28fc0f0788f5f917dcce9d35c0107b7454ca78dda3191e6dc120c
            python_libs_sha256: 4d860f1434442c69f128279705806916def2b323d1b43b7fa6ada7dfab0a0571
    env:
      KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Chaquopy needs the same Python version on the build machine as inside the app
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      # FFmpeg: the Android build (made with Android's own toolkit) from the youtubedl-android
      # project, the same one Seal and YTDLnis use. Generic Linux FFmpeg builds are blocked by
      # Android's security filter on many phones; this one isn't.
      - name: Download FFmpeg and QuickJS for ${{ matrix.abi }}
        env:
          FFMPEG_SRC: https://raw.githubusercontent.com/yausername/youtubedl-android/d725d5c9a18c3a99a13ee0308bf78275dc310760/ffmpeg/src/main/jniLibs
        run: |
          set -euo pipefail
          DIR=android/app/src/main/jniLibs/${{ matrix.abi }}
          mkdir -p "$DIR"
          curl -fsSL -o "$DIR/libqjs.so" "https://github.com/quickjs-ng/quickjs/releases/download/v0.17.0/${{ matrix.qjs }}"
          echo "${{ matrix.qjs_sha256 }}  $DIR/libqjs.so" | sha256sum -c -
          curl -fsSL -o "$DIR/libffmpeg.so" "$FFMPEG_SRC/${{ matrix.abi }}/libffmpeg.so"
          echo "${{ matrix.ffmpeg_sha256 }}  $DIR/libffmpeg.so" | sha256sum -c -
          curl -fsSL -o "$DIR/libffprobe.so" "$FFMPEG_SRC/${{ matrix.abi }}/libffprobe.so"
          echo "${{ matrix.ffprobe_sha256 }}  $DIR/libffprobe.so" | sha256sum -c -
          curl -fsSL -o "$DIR/libffmpeg.zip.so" "$FFMPEG_SRC/${{ matrix.abi }}/libffmpeg.zip.so"
          echo "${{ matrix.ffmpeg_libs_sha256 }}  $DIR/libffmpeg.zip.so" | sha256sum -c -
          # a few libraries FFmpeg needs live in the project's Python bundle: copy exactly those
          curl -fsSL -o "$RUNNER_TEMP/libpython.zip.so" "${FFMPEG_SRC%/ffmpeg/src/main/jniLibs}/library/src/main/jniLibs/${{ matrix.abi }}/libpython.zip.so"
          echo "${{ matrix.python_libs_sha256 }}  $RUNNER_TEMP/libpython.zip.so" | sha256sum -c -
          python android/tools/add_ffmpeg_deps.py "$DIR/libffmpeg.zip.so" "$RUNNER_TEMP/libpython.zip.so" "$DIR/libffmpeg.so" "$DIR/libffprobe.so"
          chmod 755 "$DIR"/*.so
          ls -la "$DIR"

      - name: Use private signing key (only if you added the secrets)
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "AK_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"
          echo "AK_KEYSTORE_PASSWORD=${{ secrets.KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
          echo "AK_KEY_ALIAS=${{ secrets.KEY_ALIAS }}" >> "$GITHUB_ENV"
          echo "AK_KEY_PASSWORD=${{ secrets.KEY_PASSWORD }}" >> "$GITHUB_ENV"

      - name: Build APK
        working-directory: android
        env:
          AK_ABI: ${{ matrix.abi }}
          AK_PYTHON: ${{ matrix.python }}
        run: |
          export AK_VERSION_CODE=$((100 + GITHUB_RUN_NUMBER))
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then export AK_VERSION_NAME="${GITHUB_REF_NAME#v}"; else export AK_VERSION_NAME="2.2.$GITHUB_RUN_NUMBER"; fi
          gradle assembleRelease --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/AK-Music-Player-${{ matrix.label }}.apk"

      - name: Check the APK contents
        run: |
          APK="AK-Music-Player-${{ matrix.label }}.apk"
          unzip -l "$APK" > contents.txt
          for f in "lib/${{ matrix.abi }}/libffmpeg.so" "lib/${{ matrix.abi }}/libffprobe.so" "lib/${{ matrix.abi }}/libffmpeg.zip.so" "lib/${{ matrix.abi }}/libqjs.so" "classes.dex" "assets/loading.html"; do
            grep -q "$f" contents.txt || { echo "::error::$f is missing from the APK"; exit 1; }
          done
          grep -q "chaquopy" contents.txt || { echo "::error::Python (Chaquopy) is missing from the APK"; exit 1; }
          ls -la "$APK"

      - uses: actions/upload-artifact@v4
        with:
          name: AK-Music-Player-${{ matrix.label }}
          path: AK-Music-Player-${{ matrix.label }}.apk

      - name: Attach APK to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: AK-Music-Player-${{ matrix.label }}.apk
          generate_release_notes: true
